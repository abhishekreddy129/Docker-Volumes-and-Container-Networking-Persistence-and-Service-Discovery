services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  web:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - frontend_net

volumes:
  postgres_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
